name: Build and test PolyLib + PyPolyLib

on:
  push:
  pull_request:

jobs:
  # --------------------------------------------------------------------
  # Test pypolylib with a PolyLib build and install
  # --------------------------------------------------------------------
  pypolylib-install:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libgmp-dev

      - name: Build and install PolyLib
        run: |
          ./autogen.sh
          ./configure --with-libgmp
          make -j$(nproc)
          sudo make install
          sudo ldconfig


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build PyPolyLib wheel
        working-directory: PyPolyLib
        run: |
          python -m pip install build
          # set PKG_CONFIG_PATH here if not installed in a standard directory
          python -m build --wheel

      - name: Install PyPolyLib
        working-directory: PyPolyLib
        run: |
          python -m venv test-venv
          test-venv/bin/pip install dist/*.whl

      - name: Check PyPolyLib installation
        working-directory: PyPolyLib
        run: |
          test-venv/bin/python -c "import pypolylib; print(pypolylib.__file__)"

      - name: Run tests
        working-directory: PyPolyLib
        run: |
          test-venv/bin/python tests/run_all_tests.py


  # --------------------------------------------------------------------
  # Test against the uninstalled PolyLib build tree
  # --------------------------------------------------------------------
  test-uninstalled:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libgmp-dev

      - name: Prepare build
        run: |
          ./autogen.sh
          mkdir build

      - name: Build PolyLib
        working-directory: build
        run: |
          ../configure --with-libgmp
          make -j$(nproc)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build PyPolyLib wheel
        working-directory: PyPolyLib
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build
        run: |
          python -m pip install build
          python -m build --wheel \
            -Ccmake.define.POLYLIB_USE_UNINSTALLED=ON

      - name: Install PyPolyLib
        working-directory: PyPolyLib
        run: |
          python -m venv test-venv
          test-venv/bin/pip install dist/*.whl

      - name: Check PyPolyLib installation
        working-directory: PyPolyLib
        run: |
          test-venv/bin/python -c "import pypolylib; print(pypolylib.__file__)"

      - name: Run tests
        working-directory: PyPolyLib
        run: |
          test-venv/bin/python tests/run_all_tests.py
