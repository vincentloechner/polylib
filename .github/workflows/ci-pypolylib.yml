name: Build and test PolyLib + PyPolyLib

on:
  push:
  pull_request:

jobs:
  pypolylib:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libgmp-dev

      - name: Build and install PolyLib
        run: |
          ./autogen.sh
          ./configure --with-libgmp
          make -j$(nproc)
          sudo make install
          sudo ldconfig


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build PyPolyLib wheel
        working-directory: PyPolyLib
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install PyPolyLib
        working-directory: PyPolyLib
        run: |
          python -m venv test-venv
          test-venv/bin/pip install dist/*.whl

      - name: Check PyPolyLib installation
        working-directory: PyPolyLib
        run: |
          test-venv/bin/python -c "import pypolylib; print(pypolylib.__file__)"

      - name: Run tests
        working-directory: PyPolyLib
        run: |
          test-venv/bin/python tests/run_all_tests.py
