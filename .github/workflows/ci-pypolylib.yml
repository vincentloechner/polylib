name: Build and test PolyLib + PyPolyLib

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libgmp-dev

      - name: Build and install PolyLib
        run: |
          ./autogen.sh
          ./configure --with-libgmp
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build PyPolyLib wheel
        working-directory: PyPolyLib
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Check PyPolyLib installation
        working-directory: PyPolyLib
        run: |
          test-venv/bin/python -c "import pypolylib; print(pypolylib.__file__)"

      - name: Install PyPolyLib
        working-directory: PyPolyLib
        run: |
          python -m venv test-venv
          test-venv/bin/pip install dist/*.whl

      - name: Run tests
        working-directory: PyPolyLib
        run: |
          test-venv/bin/python tests/run_all_tests.py
